<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Flight Recorder</title>
    <style>
:root {
  --bg: #0c1220;
  --bg-2: #121a2c;
  --bg-3: #182238;
  --line: #2a3957;
  --text: #e8eefc;
  --muted: #93a0be;
  --accent: #f5c16c;
  --agent: #7aa2ff;
  --llm: #c08cff;
  --tool: #3dd6c4;
  --decision: #f5c16c;
  --error: #ff6b7a;
  --ok: #5ee0a0;
  font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
}
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar,
.meta,
footer {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
}
footer {
  border-top: 1px solid var(--line);
  border-bottom: 0;
  margin-top: auto;
  justify-content: space-between;
  color: var(--muted);
  font-size: 12px;
}
footer a {
  color: var(--accent);
}

.brand {
  display: flex;
  gap: 12px;
  align-items: center;
}
.logo {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: conic-gradient(from 200deg, var(--accent), var(--tool), var(--agent), var(--accent));
  box-shadow: 0 0 0 1px #0008;
}
.muted {
  color: var(--muted);
  font-size: 12px;
}
.actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
}
button,
.file-btn {
  background: var(--bg-3);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
  font: inherit;
}
button:hover,
.file-btn:hover {
  border-color: var(--accent);
}
.file-btn input {
  display: none;
}
.meta {
  flex-wrap: wrap;
  font-size: 13px;
}
.k {
  color: var(--muted);
  margin-right: 6px;
}
.pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--bg-3);
  border: 1px solid var(--line);
}
.pill.ok {
  color: var(--ok);
  border-color: #1e5c40;
}
.pill.error {
  color: var(--error);
  border-color: #7a2a33;
}
.pill.warn {
  color: var(--accent);
}

.layout {
  display: grid;
  grid-template-columns: minmax(220px, 280px) 1fr minmax(260px, 340px);
  gap: 0;
  flex: 1;
  min-height: 0;
}
.tree,
.detail,
.timeline-wrap {
  padding: 16px 18px;
  overflow: auto;
}
.tree,
.detail {
  background: var(--bg);
  border-right: 1px solid var(--line);
}
.detail {
  border-right: 0;
  border-left: 1px solid var(--line);
}
h2 {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 12px;
}
.tree ol {
  list-style: none;
  margin: 0;
  padding: 0;
}
.tree li {
  margin: 0 0 2px;
}
.tree button.span-btn {
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  padding: 6px 8px;
  border-radius: 6px;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.tree button.span-btn:hover,
.tree button.span-btn.active {
  background: var(--bg-3);
}
.tree .type {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-right: 6px;
  color: var(--muted);
}
.tree .type.agent {
  color: var(--agent);
}
.tree .type.llm {
  color: var(--llm);
}
.tree .type.tool {
  color: var(--tool);
}
.tree .type.decision {
  color: var(--decision);
}
.tree .type.run {
  color: var(--accent);
}
.indent {
  display: inline-block;
  width: 12px;
}

.legend {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.swatch {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  display: inline-block;
  margin-right: 4px;
}
.swatch.agent {
  background: var(--agent);
}
.swatch.llm {
  background: var(--llm);
}
.swatch.tool {
  background: var(--tool);
}
.swatch.decision {
  background: var(--decision);
}
.swatch.error {
  background: var(--error);
}

.timeline {
  position: relative;
  min-height: 200px;
}
.lane {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 8px;
  margin-bottom: 10px;
  align-items: center;
}
.lane-label {
  font-size: 12px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.lane-track {
  position: relative;
  height: 36px;
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.bar {
  position: absolute;
  top: 6px;
  height: 24px;
  border-radius: 5px;
  min-width: 8px;
  cursor: pointer;
  border: 1px solid #0006;
  color: #081018;
  font-size: 10px;
  display: flex;
  align-items: center;
  padding: 0 6px;
  overflow: hidden;
  white-space: nowrap;
}
.bar.agent {
  background: var(--agent);
}
.bar.llm {
  background: var(--llm);
}
.bar.tool {
  background: var(--tool);
}
.bar.decision {
  background: var(--decision);
}
.bar.run {
  background: var(--accent);
}
.bar.error {
  box-shadow: 0 0 0 1px var(--error);
}
.bar.active {
  outline: 2px solid #fff;
  outline-offset: 1px;
}

.detail-body h3 {
  margin: 0 0 8px;
  font-size: 16px;
}
.kv {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin: 10px 0;
}
.kv th,
.kv td {
  text-align: left;
  padding: 4px 6px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.kv th {
  color: var(--muted);
  font-weight: 500;
  width: 42%;
}
.kv td {
  word-break: break-word;
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
}
.messages {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 12px;
}
.msg {
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12px;
}
.msg .role {
  color: var(--accent);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.redacted {
  color: var(--accent);
}

@media (max-width: 960px) {
  .layout {
    grid-template-columns: 1fr;
  }
  .tree,
  .detail {
    border: 0;
    border-top: 1px solid var(--line);
    max-height: 320px;
  }
}

</style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <strong>Agent Flight Recorder</strong>
          <div class="muted" id="run-sub">Load a trace to inspect a multi-agent run</div>
        </div>
      </div>
      <div class="actions">
        <label class="file-btn">
          Open trace
          <input id="file" type="file" accept="application/json,.json,.afr.json" />
        </label>
        <button id="demo-btn" type="button">Load demo</button>
      </div>
    </header>

    <section class="meta" id="meta" hidden>
      <div><span class="k">Run</span> <span id="meta-name">—</span></div>
      <div><span class="k">Status</span> <span id="meta-status" class="pill">—</span></div>
      <div><span class="k">Spans</span> <span id="meta-spans">—</span></div>
      <div><span class="k">Agents</span> <span id="meta-agents">—</span></div>
      <div><span class="k">Redaction</span> <span id="meta-redaction" class="pill">—</span></div>
    </section>

    <main class="layout">
      <aside class="tree" id="tree" aria-label="Span tree">
        <h2>Span tree</h2>
        <ol id="tree-list"></ol>
      </aside>
      <section class="timeline-wrap">
        <h2>Timeline</h2>
        <div class="legend">
          <span class="swatch agent"></span> agent <span class="swatch llm"></span> llm
          <span class="swatch tool"></span> tool <span class="swatch decision"></span> decision
          <span class="swatch error"></span> error
        </div>
        <div class="timeline" id="timeline"></div>
      </section>
      <aside class="detail" id="detail" aria-label="Span detail">
        <h2>Detail</h2>
        <p class="muted" id="detail-empty">Select a span in the tree or timeline.</p>
        <div id="detail-body" hidden></div>
      </aside>
    </main>

    <footer>
      <span>Local viewer · traces stay in your browser</span>
      <a href="https://github.com/kfairley9999/agent-flight-recorder">GitHub</a>
    </footer>

<script>
/* Agent Flight Recorder — local timeline viewer (no network required once loaded). */
(function () {
  const fileInput = document.getElementById('file');
  const demoBtn = document.getElementById('demo-btn');
  const treeList = document.getElementById('tree-list');
  const timeline = document.getElementById('timeline');
  const meta = document.getElementById('meta');
  const detailEmpty = document.getElementById('detail-empty');
  const detailBody = document.getElementById('detail-body');
  let current = null;
  let selectedId = null;

  fileInput.addEventListener('change', async (event) => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const text = await file.text();
    loadTrace(JSON.parse(text));
  });

  demoBtn.addEventListener('click', () => {
    if (window.AFR_TRACE) {
      loadTrace(window.AFR_TRACE);
      return;
    }
    fetch('./trace.json')
      .then((res) => {
        if (!res.ok) throw new Error('No demo trace is bundled next to this page.');
        return res.json();
      })
      .then(loadTrace)
      .catch((error) => {
        detailEmpty.hidden = false;
        detailEmpty.textContent = error.message;
      });
  });

  if (window.AFR_TRACE) {
    loadTrace(window.AFR_TRACE);
  } else {
    fetch('./trace.json')
      .then((res) => (res.ok ? res.json() : null))
      .then((trace) => {
        if (trace) loadTrace(trace);
      })
      .catch(() => {});
  }

  function loadTrace(trace) {
    current = trace;
    selectedId = null;
    renderMeta(trace);
    renderTree(trace);
    renderTimeline(trace);
    detailBody.hidden = true;
    detailEmpty.hidden = false;
    detailEmpty.textContent = 'Select a span in the tree or timeline.';
  }

  function renderMeta(trace) {
    meta.hidden = false;
    document.getElementById('run-sub').textContent =
      `${trace.run.name} · ${trace.run.id.slice(0, 8)}…`;
    document.getElementById('meta-name').textContent = trace.run.name;
    const status = document.getElementById('meta-status');
    status.textContent = trace.run.status;
    status.className = `pill ${trace.run.status === 'ERROR' ? 'error' : 'ok'}`;
    document.getElementById('meta-spans').textContent = String(trace.spans.length);
    const agents = new Set(
      trace.spans
        .filter((s) => s.attributes && s.attributes['afr.span.type'] === 'agent')
        .map((s) => s.attributes['afr.agent.id'] || s.name),
    );
    document.getElementById('meta-agents').textContent = String(agents.size);
    const red = document.getElementById('meta-redaction');
    if (trace.redaction && trace.redaction.applied) {
      red.textContent = `${trace.redaction.redactedCount} hits`;
      red.className = 'pill warn';
      red.title = (trace.redaction.rulesTriggered || []).join(', ');
    } else {
      red.textContent = 'not applied';
      red.className = 'pill';
    }
  }

  function typeOf(span) {
    return (span.attributes && span.attributes['afr.span.type']) || 'span';
  }

  function renderTree(trace) {
    treeList.innerHTML = '';
    const byParent = new Map();
    for (const span of trace.spans) {
      const key = span.parentSpanId || '';
      if (!byParent.has(key)) byParent.set(key, []);
      byParent.get(key).push(span);
    }
    const roots = byParent.get('') || trace.spans.filter((s) => !s.parentSpanId);
    const walk = (span, depth) => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'span-btn';
      btn.dataset.spanId = span.spanId;
      const type = typeOf(span);
      const label = span.name.replace(/^(agent|llm|decision|run):/, '');
      btn.innerHTML = `${'<span class="indent"></span>'.repeat(depth)}<span class="type ${type}">${escapeHtml(type)}</span> ${escapeHtml(label)}`;
      btn.addEventListener('click', () => selectSpan(span.spanId));
      li.appendChild(btn);
      treeList.appendChild(li);
      for (const child of byParent.get(span.spanId) || []) walk(child, depth + 1);
    };
    for (const root of roots) walk(root, 0);
  }

  function renderTimeline(trace) {
    timeline.innerHTML = '';
    const times = trace.spans.map((s) => Number(s.startTimeUnixNano));
    const ends = trace.spans.map((s) => Number(s.endTimeUnixNano || s.startTimeUnixNano));
    const min = Math.min(...times);
    const max = Math.max(...ends, min + 1);
    const range = Math.max(max - min, 1);

    const lanes = new Map();
    for (const span of trace.spans) {
      const type = typeOf(span);
      const laneKey =
        type === 'run' ? 'run' : (span.attributes && span.attributes['afr.agent.id']) || type;
      if (!lanes.has(laneKey)) lanes.set(laneKey, []);
      lanes.get(laneKey).push(span);
    }

    for (const [name, spans] of lanes) {
      const lane = document.createElement('div');
      lane.className = 'lane';
      const label = document.createElement('div');
      label.className = 'lane-label';
      label.textContent = name;
      const track = document.createElement('div');
      track.className = 'lane-track';
      for (const span of spans) {
        const start = Number(span.startTimeUnixNano);
        const end = Number(span.endTimeUnixNano || span.startTimeUnixNano);
        const left = ((start - min) / range) * 100;
        const width = Math.max(((end - start) / range) * 100, 1.2);
        const bar = document.createElement('button');
        bar.type = 'button';
        bar.className = `bar ${typeOf(span)}${span.status && span.status.code === 'ERROR' ? ' error' : ''}`;
        bar.style.left = `${left}%`;
        bar.style.width = `${width}%`;
        bar.textContent = span.name.replace(/^(agent|llm|decision):/, '');
        bar.title = span.name;
        bar.dataset.spanId = span.spanId;
        bar.addEventListener('click', () => selectSpan(span.spanId));
        track.appendChild(bar);
      }
      lane.appendChild(label);
      lane.appendChild(track);
      timeline.appendChild(lane);
    }
  }

  function selectSpan(id) {
    selectedId = id;
    document.querySelectorAll('[data-span-id]').forEach((el) => {
      el.classList.toggle('active', el.dataset.spanId === id);
    });
    const span = current && current.spans.find((s) => s.spanId === id);
    if (!span) return;
    detailEmpty.hidden = true;
    detailBody.hidden = false;
    const attrs = Object.entries(span.attributes || {})
      .map(
        ([k, v]) =>
          `<tr><th>${escapeHtml(k)}</th><td class="${isRedacted(v) ? 'redacted' : ''}">${escapeHtml(fmt(v))}</td></tr>`,
      )
      .join('');
    const messages = (span.events || [])
      .filter((e) => e.name === 'afr.message')
      .map((e) => {
        const role = (e.attributes && e.attributes['afr.message.role']) || 'message';
        const content = (e.attributes && e.attributes['afr.message.content']) || '';
        return `<div class="msg"><div class="role">${escapeHtml(role)}</div><div class="${isRedacted(content) ? 'redacted' : ''}">${escapeHtml(String(content))}</div></div>`;
      })
      .join('');
    const links = (span.links || [])
      .map(
        (l) =>
          `<tr><th>${escapeHtml((l.attributes && l.attributes['afr.link.type']) || 'link')}</th><td>${escapeHtml(l.spanId)}</td></tr>`,
      )
      .join('');
    detailBody.innerHTML = `
      <h3>${escapeHtml(span.name)}</h3>
      <table class="kv">
        <tr><th>span id</th><td>${escapeHtml(span.spanId)}</td></tr>
        <tr><th>status</th><td>${escapeHtml(span.status.code)}${span.status.message ? ' — ' + escapeHtml(span.status.message) : ''}</td></tr>
        ${attrs}
        ${links}
      </table>
      ${messages ? `<div class="messages">${messages}</div>` : ''}
    `;
  }

  function isRedacted(value) {
    return typeof value === 'string' && value.includes('[REDACTED:');
  }

  function fmt(value) {
    if (typeof value === 'string') return value;
    return JSON.stringify(value);
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
})();

</script>
  </body>
</html>
